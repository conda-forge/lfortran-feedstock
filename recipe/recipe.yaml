schema_version: 1

context:
  name: lfortran
  version: "0.66.0"
  llvm_version: "21.1.7"

recipe:
  name: ${{ name|lower }}-split
  version: ${{ version }}

source:
  - url: https://github.com/lfortran/lfortran/releases/download/v${{ version }}/${{ name }}-${{ version }}.tar.gz
    sha256: 961d84f49d07951a279b7835e0f9864489a167a80a8c3c502a797fb6c61669c7
    patches:
      # Fixes the WASM runtime cross-compile: lfortran_intrinsics.c includes
      # the CMake-generated <libasr/config.h>, but the emcc command line was
      # missing the build-tree include dir. To be upstreamed into LFortran.
      - patches/0001-cmake-add-generated-header-dir-to-wasm-runtime-includes.patch
  - git: https://github.com/emscripten-core/emsdk.git
    rev: "6.0.9"
    target_directory: emsdk

build:
  number: 3

outputs:
  - package:
      name: lfortran
    build:
      script:
        - if: unix
          then: build.sh
        - if: win
          then: build.bat
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - cmake =3.29.6
        - if: unix
          then: make =4.4.1
        - if: build_platform != target_platform
          then: xeus =6.0.1
        - if: build_platform != target_platform
          then: xeus-zmq =4.0.0
        - if: build_platform != target_platform
          then: llvmdev =${{ llvm_version }}
        - if: build_platform != target_platform
          then: nlohmann_json =3.12.0
        - if: build_platform != target_platform
          then: zlib
        - if: build_platform != target_platform
          then: zstd-static =1.5.7
        - if: linux and build_platform != target_platform
          then: libunwind =1.7.2
        - nodejs
        # Adding >=3.10 on Python to prevent generating a build matrix for all Python versions
        - python >=3.10
      host:
        - xeus =6.0.1
        - xeus-zmq =4.0.0
        - llvmdev =${{ llvm_version }}
        - if: linux
          then: libunwind =1.7.2
        - nlohmann_json =3.12.0
        - zlib
        - zstd-static =1.5.7
      run:
        # lfortran invokes `clang` at run time only as a linker driver to link
        # user objects against the prebuilt runtime (src/bin/lfortran.cpp). No
        # ABI coupling to the LLVM lfortran was built against, so a lower bound
        # suffices; an exact pin made lfortran unsolvable next to newer LLVM
        # toolchains (see PR #141). Override via `--linker`/`LFORTRAN_LINKER`.
        # Not needed on Windows: default target is x86_64-pc-windows-msvc,
        # linking is driven by MSVC's link.exe.
        - if: not win
          then: clang >=21
        # Windows links zstd dynamically (unix links it statically), so a run
        # dep is required there; the 1.5.x ABI is stable, hence a range, not =.
        - if: win
          then: zstd >=1.5.6,<1.6
    tests:
      - package_contents:
          bin:
            - lfortran
          files:
            - share/jupyter/kernels/fortran/kernel.json
      - requirements:
          run:
            - jupyter
            - if: win
              then: vs2022_win-64
        script:
          - if: unix
            then: test -f ${PREFIX}/bin/lfortran
          - if: win
            then: if not exist %LIBRARY_PREFIX%\bin\lfortran.exe exit 1
          - lfortran --help
          - lfortran --version
          - if: unix
            then: echo "print *, 'Hello'; end" > hello.f90 && lfortran hello.f90 && ./hello.out
          - if: win
            then: echo print *, 'Hello'; end > hello.f90 && lfortran hello.f90 -o hello.exe && hello.exe
          - jupyter kernelspec list --json
          - jupyter kernelspec remove -f fortran

  - package:
      name: xeus-lfortran
    build:
      script:
        - echo "xeus-lfortran is provided by lfortran"
    requirements:
      run:
        - ${{ pin_subpackage('lfortran', exact=True) }}
    about:
      summary: Jupyter kernel for LFortran
      description: |
        This metapackage installs LFortran, which provides the native Fortran
        kernel for Jupyter.
    tests:
      - requirements:
          run:
            - jupyter
        script:
          - lfortran --version
          - if: unix
            then: test -f ${PREFIX}/share/jupyter/kernels/fortran/kernel.json
          - if: win
            then: if not exist %PREFIX%\share\jupyter\kernels\fortran\kernel.json exit 1
          - jupyter kernelspec list --json

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Modern interactive LLVM-based Fortran compiler
  description: |
    LFortran is a modern open-source (BSD licensed) interactive Fortran
    compiler built on top of LLVM. It can execute user's code interactively to
    allow exploratory work (much like Python, MATLAB or Julia) as well as
    compile to binaries with the goal to run user’s code on modern
    architectures such as multi-core CPUs and GPUs.
  homepage: https://lfortran.org
  repository: https://github.com/lfortran/lfortran
  documentation: https://docs.lfortran.org/

extra:
  recipe-maintainers:
    - certik
    - Shaikh-Ubaid
